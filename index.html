<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="PMO de despliegue de red movil" />

    <!--
      El SDK de Firebase recien descubre estos hosts cuando el navegador termina
      de parsear el bundle, y ahi paga DNS + TLS en serie antes del primer byte
      de datos. Abrir la conexion desde el HTML la solapa con esa descarga: en
      movil son un par de cientos de milisegundos menos hasta ver la tabla.
      Con emuladores sobran (todo va a 127.0.0.1) pero no cuestan nada: el
      navegador cierra la conexion que no se usa.
    -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <title>PMO3000</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar el parpadeo blanco.
      ;(function () {
        try {
          var guardado = localStorage.getItem('pmo3000.tema')
          var tema =
            guardado === 'claro' || guardado === 'oscuro'
              ? guardado
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'oscuro'
                : 'claro'
          document.documentElement.dataset.tema = tema

          var densidad = localStorage.getItem('pmo3000.densidad')
          if (densidad === 'compacta' || densidad === 'comoda') {
            document.documentElement.dataset.densidad = densidad
          }
        } catch (_) {
          document.documentElement.dataset.tema = 'claro'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
